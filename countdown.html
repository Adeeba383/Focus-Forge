<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count-down Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="checkbox" id="theme-toggle" hidden>
    <label for="theme-toggle" class="toggle-btn">🌙 Dark Mode</label>
    <div id="section1">
    <h1>*COUNT-DOWN TIMER*</h1>
    <hr>
    <div id="time-inputs">
        <label>Hours <input type="number" id="hours" min="0" value="0"></label>
        <label>Minutes <input type="number" id="minutes" min="0" value="0"></label>
        <label>Seconds <input type="number" id="seconds" min="0" value="0"></label>
      </div> 
      <hr>
      <button id="set" onclick="set()">Set</button>     
    <div id="display-container">
        <div id="display-countdown">00:00:00</div>
        <div id="buttons">
        <button id="button1" onclick="start1()">Start</button>
        <button id="button2" onclick="togglePauseResume(this)">Pause</button>
        <button id="button3" onclick="reset()">Reset</button>
    </div>
    <button id="backbtn"><a href="index.html">Home Page</a></button>
    </div>
</div></div>
    <script src="index.js"></script>
</body>
</html>
