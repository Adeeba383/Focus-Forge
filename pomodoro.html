<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="checkbox" id="theme-toggle" hidden>
    <label for="theme-toggle" class="toggle-btn">🌙 Dark Mode</label>
    <div id="section1">
    <h1>*POMODORO TIMER*</h1>
    <div id="Breaks">
        <input type="radio" id="shortBreak" name="break" class="break" hidden>
        <label for="shortBreak" class="break-label">Short Break</label>
        <input type="radio" id="longBreak" name="break" class="break" hidden>
        <label for="longBreak" class="break-label">Long Break</label>
      </div>
      
    <div id="display-container">
        <div id="display-pomodoro">25:00</div>
        <div id="buttons">
        <button id="button1" onclick="start2()">Start</button>
        <button id="stopResumeBtn" onclick="togglePauseResume2(this)">Pause</button>
        <button id="button3" onclick="reset2()">Reset</button>
    </div>
    <button id="backbtn"><a href="index.html">Home Page</a></button>
    </div>
</div>
    </div>
    <script src="index.js"></script>
</body>
</html>
